  implementation:
    commit: 0f7fd4f
    changed: scripts/check-forge-loop.sh
    added_checks:
      - CK-09 .ai/development-status.yaml + version-state.yaml 必填段（§3.5）
      - CK-09 叶子字段 assertion：iteration.current / git.branch·head·clean（§55）
      - 8b 四个状态文件 YAML 可解析且为非空映射（恢复链前置）
    rationale: >-
      源于本轮真实踩坑——version-state.yaml 的 `pending: B-03` 等未加引号含冒号值
      使整个文件 YAML 解析失败，但骨架键检查全部通过；恢复链（§98）将直接读不到。
      故 CK-09 只验骨架不足以承担「落盘契约」，补 8b 解析校验。
  tests:
    - 正向：bash scripts/check-forge-loop.sh → 52/52 PASS, exit 0, skip:0
    - I1 空文件：verification-state 清零 → 解析失败/非空映射, exit 1
    - I1b 仅注释 / 裸标量 / YAML 列表 → 均 exit 1（isinstance(d,dict) and d 覆盖）
    - I2 文件缺失：移走 verification-state → 报「缺失（恢复链将无法读取）」, exit 1
    - I3 叶子字段缺失：删 git.head / git.clean → 两条 FAIL, exit 1
    - Minor SKIP 计数：PATH 剥离 python → [SKIP] 且 skip:1 可见
    - Minor feature 通配：临时建 .ai/forgeloop-phase2/evidence.yaml → 被枚举, exit 0（测后清理）
    - 复原：全部负向复原 → 52/52 PASS, exit 0
  review:
