REQ-005-EXT:
  title: Test —— CK-09 .ai/ 状态落盘契约与 8b YAML 可解析性（EXEC-2 扩充）
  source: [SRC-005]
  spec:
    section: 详细设计 §3.5（.ai/ 结构）+ §98 Goal Resume（恢复链读取状态文件）
    version: "absent: not-started"
  task:
