      - I2 缺失与语法错误共用文案（Important）→ 循环体前置 [ -f ] 检查，两条独立消息
      - I3 check_keys 只验顶层段（Important）→ 新增 check_leaf 二级断言
      - set-e 落雷（Minor）→ check_keys 显式 return 0
      - SKIP 不计数（Minor）→ skip 计数器入汇总
      - feature 段写死（Minor）→ nullglob 通配枚举 .ai/*/evidence.yaml
    not_fixed:
      - check_leaf 按缩进而非父段作用域定位（Minor）→ 留档后续收紧；放错父段时恢复链同样暴露
      - feature 目录缺 evidence.yaml 时不判 FAIL（Minor）→ 留档后续收紧
