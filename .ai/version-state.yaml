# 版本状态（DESIGN.md §55 schema）
# B-03（Project Version 无来源）未解除 → project.version 写显式待定值，
# 其余字段正常维护（详细设计 §3.5）。版本判定服从 Global Version Management Rules，
# 不得由 Design Version 推导（AGENTS.md §7、rules/version-management.md §5）。

project:
  version: "pending: B-03"            # B-03 未解除，不自定版本号

goal:
  id: FL-001

mvp:
  version: "pending: B-03"            # 版本服从全局 Version Management，不自定
                                   # MVP Scope 已产出：.ai/forgeloop-phase1/mvp-scope.yaml

spec:
  version: "absent: not-started"      # SPEC/Plan 不在第一阶段范围（D/E 延后复用既有 skill）

plan:
  revision: "absent: not-started"

iteration:
  current: ITER-002

git:
  branch: main
  head: "972a9fa"
  # clean 的比对对象与详细设计 §3.5 的冲突判据完全一致 = 代码与文档路径（排除 .ai/），
  # 即 `git status --porcelain -- ':!.ai/'`。迭代中途 `.ai/` 自身变脏属预期
  # （状态文件仅在 Checkpoint 提交），不计入本字段。
  #
  # 时点：clean 的值锚定**最近一次 Checkpoint 提交时刻**，该时刻比对对象为空——
  # 因为 Task 的产出物本身也落在比对对象内，提交前的任意时刻跑该命令都会得到非空。
  # 恢复者若按此刻跑该命令得非空结果，这与 §3.5 判据的处置一致（条件①成立但
  # task.status ≠ complete → 不触发 STOP，见 recovery-record.md §3.3）。
  # 字段值不应被读成「此刻的工作树快照」。
  clean: true                    # 锚定最近一次 Checkpoint 提交时刻（当前为 CP-008 / 972a9fa）
