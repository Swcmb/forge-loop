# 版本状态（DESIGN.md §55 schema）
# B-03 已于 T-17 解除：仓库根 VERSION 文件为 Project Version 的唯一权威源
# （ADR-007 §5；version-governance.md §9.2 / §4.6）。其余字段正常维护。
# 版本判定仍服从 Global Version Management Rules，
# 不得由 Design Version 推导（AGENTS.md §7、rules/version-management.md §5）。

project:
  version: "0.1.0"                   # 引用仓库根 VERSION 文件（T-17 翻转值），Release 时由
                                       # T-29/T-30 的 Global Version Management 判定是否变更

goal:
  id: FL-002                           # 与 development-status.goal.id 同值，由自检 CK-16
                                       # 逐次核对（§55 schema 在两个文件各记一次 goal.id）。
                                       # FL-001 于 T-15 收口但未收口 Goal，其未覆盖部分
                                       # （I-007 / I-008 / L / M / N）由 FL-002 承接。
                                       # B-03 已于 T-17 解除，不再列入承接范围。
  prev:
    id: FL-001
    closed_by: T-15
    closed_at_commit: "37c5f83"

mvp:
  version: "0.1.0"                   # 与 project.version 同源（仓库根 VERSION 文件）
                                   # MVP Scope 已产出：.ai/forgeloop-phase1/mvp-scope.yaml
                                   # 与 .ai/forgeloop-phase2/mvp-scope.yaml（ADR-007 裁定）
  current_feature: forgeloop-phase2

spec:
  version: "absent: not-started"      # SPEC 由 D 阶段产出（T-18 契约 / T-21 演练）

plan:
  revision: "absent: not-started"     # Plan 由 E 阶段产出（T-19 契约 / T-21 演练）

iteration:
  current: ITER-003                   # 与 development-status.iteration.current 同值

git:
  branch: main
  head: "37c5f83"
  # clean 的比对对象与详细设计 §3.5 的冲突判据完全一致 = 代码与文档路径（排除 .ai/），
  # 即 `git status --porcelain -- ':!.ai/'`。迭代中途 `.ai/` 自身变脏属预期
  # （状态文件仅在 Checkpoint 提交），不计入本字段。
  #
  # 时点：clean 的值锚定**最近一次 Checkpoint 提交时刻**，该时刻比对对象为空——
  # 因为 Task 的产出物本身也落在比对对象内，提交前的任意时刻跑该命令都会得到非空。
  # 恢复者若按此刻跑该命令得非空结果，这与 §3.5 判据的处置一致（条件①成立但
  # task.status ≠ complete → 不触发 STOP，见 recovery-record.md §3.3）。
  # 字段值不应被读成「此刻的工作树快照」。
  clean: true                    # 锚定最近一次 Checkpoint 提交时刻（当前为 CP-009 / 37c5f83）
