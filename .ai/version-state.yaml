# 版本状态（DESIGN.md §55 schema）
# B-03 已于 T-17 解除：仓库根 VERSION 文件为 Project Version 的唯一权威源
# （ADR-007 §5；version-governance.md §9.2 / §4.6）。其余字段正常维护。
# 版本判定仍服从 Global Version Management Rules，
# 不得由 Design Version 推导（AGENTS.md §7、rules/version-management.md §5）。

project:
  version: "1.0.0"                   # 引用仓库根 VERSION 文件；T-29 按 Global Version
                                       # Management §4.4 的 adoption 条件判定首次 Release 版本

goal:
  id: FL-003                           # 与 development-status.goal.id 同值，由自检 CK-16 核对
                                       # （§55 schema 在两个文件各记一次 goal.id）。
  closed_by: T-32                                       # 与 development-status.goal.closed_by 同值
  release: v1.0.0                                       # 本 Goal 期间无版本变更，沿用 v1.0.0
  prev:
    id: FL-002
    closed_by: T-30
    closed_at_commit: "ac4a6b7"        # PR #20 squash；tag v1.0.0 指向该 commit
    release: v1.0.0                    # 本 Goal 期间沿用 v1.0.0，无版本变更

mvp:
  version: "1.0.0"                   # 与 project.version 同源（仓库根 VERSION 文件）
                                   # MVP Scope 已产出：.ai/forgeloop-phase1/mvp-scope.yaml
                                   # 与 .ai/forgeloop-phase2/mvp-scope.yaml（ADR-007 裁定）
  current_feature: forgeloop-phase3                    # 随 FL-003 建立（该字段当前无消费方，
                                                     # 但指向的目录须与 goal.id 一致以免后续误用）

spec:
  version: "SPEC-2026-10-13.0.1.0"     # T-21 D 演练产出；doc/design/spac-002-detailed-design.md

plan:
  revision: "PLAN-r1"                 # T-21 E 演练产出；doc/plans/spac-002-implementation-plan.md

iteration:
  current: ITER-004                   # 与 development-status.iteration.current 同值

git:
  branch: main
  head: "c6391c3"
  # clean 的比对对象与详细设计 §3.5 的冲突判据完全一致 = 代码与文档路径（排除 .ai/），
  # 即 `git status --porcelain -- ':!.ai/'`。迭代中途 `.ai/` 自身变脏属预期
  # （状态文件仅在 Checkpoint 提交），不计入本字段。
  #
  # 时点：clean 的值锚定**最近一次 Checkpoint 提交时刻**，该时刻比对对象为空——
  # 因为 Task 的产出物本身也落在比对对象内，提交前的任意时刻跑该命令都会得到非空。
  # 恢复者若按此刻跑该命令得非空结果，这与 §3.5 判据的处置一致（条件①成立但
  # task.status ≠ complete → 不触发 STOP，见 recovery-record.md §3.3）。
  # 字段值不应被读成「此刻的工作树快照」。
  clean: true                    # 锚定最近一次 Checkpoint 提交时刻（CP-012 / c6391c3，随 §11.2 回填同步）
