# --- Assertion 记录 ---

assertions:
  di02_reference_paths:
    desc: 活引用文档不得出现 ForgeLoop.DESIGN.md 写法；DESIGN.md 必须磁盘实存
    status: passed
    evidence: >-
      自检第 11 组。扫描对象 = git ls-files 的 .md/.yaml/.sh，剔除 7 项路径白名单
      （CHANGELOG.md、.ai/forgeloop-phase3/evidence.yaml（本文件）、doc/INITIAL-DELIVERY.md、doc/design/spac-001-detailed-design.md、
      doc/audits/repository-audit.md、doc/requirements/brainstorming-results.md、
      scripts/check-forge-loop.sh、rules/git-integration.md、CLAUDE.md）；
      另断言 DESIGN.md 存在且非空。白名单为单一来源，由 DI02_EXEMPT 一处定义。
      四条负向验证见 T-31 条目的 tests 字段；其中负向 4 针对的是判据自身的失效模式。
    note: >-
      该组在实现过程中三次静默失效，均由负向测试而非正向测试暴露：

      1. Python 插入脚本时把 \0 转义写成真实 NUL 字节——grep 将脚本判为 binary，
         扫描零命中却读作「无违规」。发现方式是负向测试未触发。
      2. 改用「按次数预算」时用 `printf | while read` 输出违规文件——管道让 while
         循环跑在子 shell，循环内 fail=$((fail+1)) 回不到父 shell，FAIL 行照常打印
         而汇总仍是 0 fail 且 exit 0。发现方式是复跑时 FAIL 行数与汇总计数不一致。
      3. 白名单最初是整文件豁免，CLAUDE.md 与 rules/git-integration.md 被整档放过——
         往这两个文件注入旧写法后自检仍 exit 0，而它们恰是承载「一律用 DESIGN.md」
         这条约定本身、最可能被重新引入该缺陷的文件。即「Evidence 称旧写法重新出现
         即 exit 1」这句断言对它们为假。由独立 Code Review 发现。

      三次失效同属一类：断言的失效模式与被断言对象的失效模式同等重要。
      只测「有违规时会不会红」不够，还要测「判据自己跑不起来时会不会红」——
      这也是 T-20 为 audit-state-probe 设「T-20 勾选后文件缺失判 FAIL」防护的同一动机。