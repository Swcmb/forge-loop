    Task ID（T-16 起）跨 Goal 连续不重编，避免同一份产物出现两个 Task 身份。
  global_task_seq: 17                                  # 全项目累计已完成 Task 数（跨 Goal）

checkpoint:
  last: CP-009
  id: CP-009
  goal: {id: FL-001}                                # CP-009 由 FL-001 形成，故仍记 FL-001
  iteration: {id: ITER-002}                         # 同上——Checkpoint 记录的是「形成它
                                                     # 的那个 Goal 与 Iteration」，不是
                                                     # 当前 Goal。跨 Goal 切换时 CP-009
                                                     # 的归属不因后续 Goal 建立而改写
  task: {id: T-15}
  git: {commit: "37c5f83"}                              # §53 原字段名；PR Swcmb/forge-loop#15 squash
  spec: {version: "absent: not-started"}               # §53 原字段名；第一阶段 SPEC 不在范围
  progress:
    # 计数须与 .ai/<feature>/requirement-matrix.yaml 的 status **合计**一致，由自检 8c 组的
    # CK-13 跨文件核对。第二迭代起 .ai/ 下有多个 feature 目录，checkpoint 仍是单一的
    # （DESIGN.md §79），故此处是合计值而非某个 feature 的值。
    # 当前合计：phase1 的 REQ-001..009 全 VERIFIED（9）+ phase2 的 REQ-D/E/L/M/N 全
    # PENDING（5）。
    requirements: {total: 14, verified: 9, reviewing: 0, pending: 5}
  note: T-15 结构自检 + 全闭环证据汇总完成。第一阶段收口：V-00～V-13 全部 14 条 passed，
        §108 的 I-001～I-006 / I-009 / I-010 全部成立（I-003/I-004 为本 Task 机械扫描
        首次核对，此前是推断），自检 85/85。项目级 Goal 未收口——I-007/I-008、Final Audit、
        Version State Valid 均依赖 L 与 B-03，ADR-002 延后至第二迭代。
        下一 Task = T-16（Phase 2 范围裁定）
  convention: >-
    git_commit 的取值口径、占位值词表（pending: <taskID> merge）、回填时同步
    git.head 的要求，见 rules/git-integration.md §11。本字段仅留指针，规则条文
    不落在 per-Goal 运行态文件里。
  history:                                        # §54 Version Comparison / Progress Tracking 的锚点
    # git_commit 一律加引号保持字符串类型：纯数字短 hash（9217165）不加引号会被 YAML
    # 解析成整数，与其余字符串值类型分裂，跨文件比较与打印行为不一致。
    # Scope 观察（T-13 Review 记录）：§11.2 的字面授权是「回填该 Checkpoint 的 hash」，
    # 而此处统一了全部六条的类型。CP-004 的 9217165 由 int 变 str 是真实的类型修正，
    # 其余五行为无行为变化的一致性处理。**类型统一的授权边界由 Review Gate 判定，
    # 此处仅记录事实与影响范围**，不预先裁定其是否越权。历史值未改写。
