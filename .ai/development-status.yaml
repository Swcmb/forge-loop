verification:
  # overall 是本工程自定义的汇总字段，DESIGN.md §57 的 audit-state.yaml 未定义它，
  # 词表固定为三值：
  #   in-progress     本阶段尚有判据 pending
  #   phase-1-closed  第一阶段（ADR-002 §2 的 A/B/C/F,G,H,I,J,K）全部判据 passed，
  #                   但项目级 Goal 未收口——I-007/I-008、Final Audit、Version State Valid
  #                   均依赖 §109 的 L 与 B-03
  #   complete        项目级收口（L/M/N 全部交付且 B-03 解除），Phase 2 达成
  #
  # 时点：T-30 于 2026-10-13 转入 complete。收口审计见
  # doc/audits/phase2/goal-closeout.md（§94 九项 + AGENTS.md §15 六项 + I-007/I-008 判据落盘）。
  overall: complete
  passed: [V-00, V-01, V-02, V-03, V-04, V-05, V-06, V-07, V-08, V-09, V-10, V-11, V-12, V-13]
  pending: []
  phase2_requirements: [REQ-D, REQ-E, REQ-L, REQ-M, REQ-N]   # 全部 VERIFIED，evidence 见 .ai/forgeloop-phase2/evidence.yaml（12 条）
