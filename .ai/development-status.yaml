# ForgeLoop 自身运行状态（Owner = FORGELOOP → .ai/）
# 依据 DESIGN.md §55 / §56 / §79、项目 rules/state-and-recovery.md、
# 详细设计 doc/design/spac-001-detailed-design.md §3.5
# 由 T-03 建立；每个 Checkpoint 时更新并随仓库提交。

goal:
  id: FL-002
  title: ForgeLoop 第二阶段 D/E/L/M/N 收口与 Goal 收口
  scope_ref: doc/decisions/ADR-007-phase2-scope.md      # §109 的 D/E/L/M/N + B-03
  design_ref: doc/design/spac-002-detailed-design.md    # T-21 产出（SPEC-2026-10-13.0.1.0）
  plan_ref: doc/plans/spac-002-implementation-plan.md   # T-21 产出（PLAN-r1）
  closed_by: T-30                                       # Goal 收口 Task
  closeout: doc/audits/phase2/goal-closeout.md          # §94 九项 + §15 六项 + I-007/I-008
  # FL-002 于 T-30 收口：ADR-007 §2 登记的三类承接元素全部解除——
  # I-007/I-008（§108 不变量）、D/E/L/M/N（§109 能力）、B-03（版本缺陷）。
  # Goal FL-001 承接自本 Goal 的未覆盖部分至此清零（mvp-acceptance.md §5 的清单）。
  prev:
    id: FL-001
    title: ForgeLoop 第一阶段端到端闭环 MVP
    scope_ref: doc/decisions/ADR-002-mvp-scope.md
    closed_by: T-15
    closed_at_commit: "37c5f83"                        # PR Swcmb/forge-loop#15 squash
    acceptance: doc/audits/mvp-acceptance.md            # V-00～V-13 全 passed
    # FL-001 的 Goal 未收口（§94 九项中 Final Audit / Version State Valid /
    # Git State Valid 三项未满足），其未覆盖部分由 FL-002 承接——见
    # mvp-acceptance.md §5「本验收未覆盖的部分」。故 FL-002 不是「重新开始」，
    # 而是 FL-001 剩余收口项的继续执行，Task ID 序列（T-16 起）跨 Goal 连续。
    # carried_over 的元素跨三类命名空间：§108 不变量 ID（I-007/I-008）、§109
    # 能力字母代号（D/E/L/M/N）、B-03 版本缺陷编号。三类各自的正式登记处见
    # ADR-007 §2（REQ-D/REQ-E/REQ-L/REQ-M/REQ-N 是一一对应的正式 Requirement ID）。
    carried_over: [I-007, I-008, D, E, L, M, N, B-03]

phase: COMPLETE                                       # DESIGN.md §106（T-30 收口）
mode: GOAL                                             # /goal 已激活（本会话），Goal Mode

task:
  current: T-30                                          # Phase 2 Final Audit + Goal 收口
  status: complete                                       # §94 九项 + §15 六项全 PASS，overall 转 complete
  prev: [T-01, T-02, T-03, T-04, T-05, T-06, T-07, T-08, T-09, T-09b, T-10a, T-10b-EXEC-1, T-10b-EXEC-2, T-11, T-12, T-13, T-14, T-15, T-16, T-17, T-18, T-19, T-20, T-21, T-22, T-23, T-24, T-25, T-26, T-27, T-28, T-29, T-30]
  next: 无（FL-002 已收口；后续变更进入新的 Goal）

iteration:
  current: ITER-003                                    # §49。FL-002 的首个 Iteration：
                                                     # FL-001 用到 ITER-002（task_seq 17）
  task_seq: 1                                          # 本 goal（FL-002）内第 1 个 Task
  task_seq_note: >-
    口径分离：task_seq 计入**本 Goal 内**已完成的 Task 数，故 FL-002 从 1 起算；
    Task ID（T-16 起）跨 Goal 连续不重编，避免同一份产物出现两个 Task 身份。
  global_task_seq: 32                            # 全项目累计已完成 Task 数（跨 Goal）

checkpoint:
  last: CP-010
  id: CP-010
  goal: {id: FL-002}                                # CP-010 由 FL-002 形成
  iteration: {id: ITER-003}                         # 同上——Checkpoint 记录的是「形成它
                                                     # 的那个 Goal 与 Iteration」，不是
                                                     # 当前 Goal。跨 Goal 切换时 CP-009
                                                     # 的归属不因后续 Goal 建立而改写
  task: {id: T-30}
  git: {commit: "pending: T-30 merge"}               # §11.2 占位值；下一个 commit 回填
  spec: {version: "SPEC-2026-10-13.0.1.0"}           # §53 原字段名；T-21 D 演练产出
  progress:
    # 计数须与 .ai/<feature>/requirement-matrix.yaml 的 status **合计**一致，由自检 8c 组的
    # CK-13 跨文件核对。第二迭代起 .ai/ 下有多个 feature 目录，checkpoint 仍是单一的
    # （DESIGN.md §79），故此处是合计值而非某个 feature 的值。
    # 当前合计：phase1 的 REQ-001..009 全 VERIFIED（9）+ phase2 的 REQ-D/E/L/M/N 全
    # VERIFIED（5）。phase2 的五条在 T-29 Release Gate 逐项核对时随 §58 状态机翻转——
    # 每条的八字段 Evidence 见 .ai/forgeloop-phase2/evidence.yaml。
    requirements: {total: 14, verified: 14, reviewing: 0, pending: 0}
  note: T-30 Phase 2 Final Audit + Goal 收口完成。§94 完成模型九项全 PASS，AGENTS.md §15
        六项全 PASS；I-007（Final Audit 对照 source requirements）与 I-008（Required
        Requirement 未全 verified 时 Goal 不可 complete）的判据落盘于
        doc/audits/phase2/goal-closeout.md。I-008 的兜底是可执行断言——CK-13 跨两个
        requirement-matrix 聚合 status 分布与 checkpoint.progress.requirements 比对。
        ADR-007 §2 登记的三类承接元素（I-007/I-008、D/E/L/M/N、B-03）全部解除，
        mvp-acceptance.md §5 的未覆盖清单清零。verification.overall 转 complete。
        自检 103/0/0；VERSION=1.0.0（§4.4 adoption 条件判定）；v1.0.0 tag 指向本 Task
        的收口 commit。FL-002 无下一 Task。
  convention: >-
    git_commit 的取值口径、占位值词表（pending: <taskID> merge）、回填时同步
    git.head 的要求，见 rules/git-integration.md §11。本字段仅留指针，规则条文
    不落在 per-Goal 运行态文件里。
  history:                                        # §54 Version Comparison / Progress Tracking 的锚点
    # git_commit 一律加引号保持字符串类型：纯数字短 hash（9217165）不加引号会被 YAML
    # 解析成整数，与其余字符串值类型分裂，跨文件比较与打印行为不一致。
    # Scope 观察（T-13 Review 记录）：§11.2 的字面授权是「回填该 Checkpoint 的 hash」，
    # 而此处统一了全部六条的类型。CP-004 的 9217165 由 int 变 str 是真实的类型修正，
    # 其余五行为无行为变化的一致性处理。**类型统一的授权边界由 Review Gate 判定，
    # 此处仅记录事实与影响范围**，不预先裁定其是否越权。历史值未改写。
    - {id: CP-001, git_commit: "bab31db", task: T-01..T-10a, note: 原记 823615b（分支内 commit，squash 后失联）}
    - {id: CP-002, git_commit: "2ccef05", task: 更正 mvp 安装状态与 CP-002 记录}
    - {id: CP-003, git_commit: "a8b60e9", task: T-10b-EXEC-1, note: "结构化 last 未落盘——被 CP-004 的状态写入直接覆盖；Git 侧由 a8b60e9 与 PR #9 确认"}
    - {id: CP-004, git_commit: "9217165", task: T-10b-EXEC-2, note: 原记 0f7fd4f（分支内 commit，squash 后失联）}
    - {id: CP-005, git_commit: "24d6e2c", task: T-11, note: 原记 9217165（实为 CP-004 的 main 侧 commit，指向滞后一格）}
    - {id: CP-006, git_commit: "578eeaa", task: T-12, note: "PR Swcmb/forge-loop#12 squash merge"}
    - {id: CP-007, git_commit: "5450675", task: T-13, note: "PR Swcmb/forge-loop#13 squash merge；§11.2 回填后建立"}
    - {id: CP-008, git_commit: "972a9fa", task: T-14, note: "PR Swcmb/forge-loop#14 squash merge"}
    - {id: CP-009, git_commit: "37c5f83", task: T-15, note: "PR Swcmb/forge-loop#15 squash merge"}
    - {id: CP-010, git_commit: "pending: T-30 merge", task: T-30, note: "Goal FL-002 收口；§11.2 占位值，由下一个 commit 回填"}

