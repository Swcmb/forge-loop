    - {id: CP-002, git_commit: "2ccef05", task: 更正 mvp 安装状态与 CP-002 记录}
    - {id: CP-003, git_commit: "a8b60e9", task: T-10b-EXEC-1, note: "结构化 last 未落盘——被 CP-004 的状态写入直接覆盖；Git 侧由 a8b60e9 与 PR #9 确认"}
    - {id: CP-004, git_commit: "9217165", task: T-10b-EXEC-2, note: 原记 0f7fd4f（分支内 commit，squash 后失联）}
    - {id: CP-005, git_commit: "24d6e2c", task: T-11, note: 原记 9217165（实为 CP-004 的 main 侧 commit，指向滞后一格）}
    - {id: CP-006, git_commit: "578eeaa", task: T-12, note: "PR Swcmb/forge-loop#12 squash merge"}
    - {id: CP-007, git_commit: "5450675", task: T-13, note: "PR Swcmb/forge-loop#13 squash merge；§11.2 回填后建立"}
    - {id: CP-008, git_commit: "972a9fa", task: T-14, note: "PR Swcmb/forge-loop#14 squash merge"}
    - {id: CP-009, git_commit: "37c5f83", task: T-15, note: "PR Swcmb/forge-loop#15 squash merge"}

